<div id="alarmView">
<div class="times"><div class="timebox nowbox"><div class="label">現在時刻</div><strong id="now">--:--</strong></div><div class="timebox alarmbox"><div class="label">現在のCASIOアラーム時刻<br><strong id="current">--:--</strong></div><small id="currentNote">未確認</small></div></div>

</div>
<div id="calcView" hidden>
<div class="calcLine"><button id="calcA" class="calcValue active"><small>時刻 A</small><strong id="calcAText">--:--:--</strong></button><button id="calcOp" class="calcOp">＋</button><button id="calcB" class="calcValue"><small>時間 B</small><strong id="calcBText">--:--:--</strong></button></div>
<div class="calcResult"><small>結果</small><strong id="calcResult">--:--:--</strong><span id="calcNote"></span></div>
<div class="calcBottom"><div class="pad" id="calcPad"><button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button class="sub" data-digit="clear">消去</button><button data-digit="0">0</button><button class="sub" data-digit="back">⌫</button></div></div>
</div>
<script>(()=>{'use strict';
const tail='-b012-49a8-b1f8-394fb2032b0f',uuid=n=>'26eb00'+n+tail,$=id=>document.getElementById(id),name='CASIO MTG-B1000';
let device=null,request=null,setting=null,digits='',armed=null,connecting=false,pending=null,attempt=0,timer=null,writing=false;const lines=[];
function log(s){lines.push(s);console.debug(s)}
function status(s){$('status').textContent=s}
function hex(a){return a.map(b=>b.toString(16).padStart(2,'0')).join(' ')}
function fmt(a){return String(a.h).padStart(2,'0')+':'+String(a.m).padStart(2,'0')}
function showCurrent(a){$('current').textContent=fmt(a);$('currentNote').textContent=a.on?'ON':'OFF';$('currentNote').className=a.on?'on':'off'}
function tick(){const d=new Date();$('now').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function parsed(){if(digits.length!==4)return null;const h=Number(digits.slice(0,2)),m=Number(digits.slice(2));return h<24&&m<60?{h,m}:null}
function paint(){const s=(digits+'----').slice(0,4);$('display').textContent=s.slice(0,2)+':'+s.slice(2);$('display').classList.toggle('placeholder',digits.length<4);$('armAction').textContent=armed?'接続待ち':writing?'転送中…':'CASIOアラームに転送';$('arm').disabled=!!armed||writing||!parsed();$('cancel').hidden=!armed;}
function disconnected(){request=setting=null;if($('currentNote').className==='on'||$('currentNote').className==='off')$('currentNote').textContent+='・前回';if(pending){pending.reject(Error('接続が切れました'));pending=null}if(armed&&!writing){status('接続待ち');schedule()}else if(!writing)status('切断');}
function waitAnswer(){return new Promise((resolve,reject)=>{const t=setTimeout(()=>{pending=null;reject(Error('時計から返事がありません'))},5000);pending={resolve:b=>{clearTimeout(t);pending=null;resolve(b)},reject:e=>{clearTimeout(t);pending=null;reject(e)}}})}
async function read(){const answer=waitAnswer();try{await request.writeValueWithoutResponse(new Uint8Array([0x15]))}catch(e){pending?.reject(e);await answer.catch(()=>{});throw e}const b=await answer;log('読取: '+hex(b));if(b.length!==5||b[0]!==0x15||b[3]>23||b[4]>59)throw Error('アラーム1の返事を解読できません');return{h:b[3],m:b[4],on:!!(b[1]&0x40)}}
function schedule(){if(timer||!armed)return;timer=setTimeout(()=>{timer=null;connect()},2500)}
async function connect(){if(!armed||connecting||writing)return;connecting=true;try{
 if(!isSecureContext||!navigator.bluetooth)throw Error('Android ChromeのHTTPSページで開いてください');
 if(!device){const all=navigator.bluetooth.getDevices?await navigator.bluetooth.getDevices():[];device=all.find(d=>d.name===name)}
 if(!device){status('時計を選択');device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[uuid('0d'),0x1804]});if(device.name!==name){device=null;throw Error('B1000以外が選ばれました')}}
 if(!armed)return;
 device.removeEventListener('gattserverdisconnected',disconnected);device.addEventListener('gattserverdisconnected',disconnected);
 status('接続待ち');
 const server=device.gatt.connected?device.gatt:await device.gatt.connect();if(!armed)return;
 const svc=await server.getPrimaryService(uuid('0d'));request=await svc.getCharacteristic(uuid('2c'));setting=await svc.getCharacteristic(uuid('2d'));
 await setting.startNotifications();setting.addEventListener('characteristicvaluechanged',onNotify);
 connecting=false;await sendArmed();return;
 }catch(e){log('接続: '+e.name+' '+e.message);if(armed){status(e.name==='NotFoundError'?'時計を選択':'接続待ち: '+e.message);if(e.name==='NotFoundError'&&!device){armed=null;status('選択を中止');paint()}}}
 finally{connecting=false;paint();if(armed&&!writing)schedule()}}
function onNotify(e){const v=e.target.value,b=Array.from(new Uint8Array(v.buffer,v.byteOffset,v.byteLength));if(b[0]===0x15&&pending)pending.resolve(b)}
async function sendArmed(){if(!armed||writing)return;writing=true;const target=armed;armed=null;paint();try{
 const before=await read();showCurrent(before);
 if(before.h===target.h&&before.m===target.m&&before.on===target.on){status('時計はすでに '+fmt(before)+' '+(before.on?'ON':'OFF')+' です');return}
 // 書込は一回のみ。結果が不明な場合は自動再送しない。
 const b=[0x15,target.on?0x40:0,0x40,target.h,target.m];log('設定送信: '+hex(b));status(fmt(target)+' を時計へ送信中…');
 await setting.writeValueWithResponse(new Uint8Array(b));await new Promise(r=>setTimeout(r,300));
 const after=await read();showCurrent(after);
 status(after.h===target.h&&after.m===target.m&&after.on===target.on?'送信成功 '+fmt(after)+' '+(after.on?'ON':'OFF'):'確認不一致');
 }catch(e){log('送信または確認失敗: '+e.name+' '+e.message);status('確認できません（再送なし）')}
 finally{writing=false;paint()}}
$('pad').onclick=e=>{const k=e.target.closest('button')?.dataset.key;if(!k||armed||writing)return;if(k==='clear')digits='';else if(k==='back')digits=digits.slice(0,-1);else digits=(digits.length===4?'':digits)+k;paint();if(digits.length===4&&!parsed())status('入力確認')};
$('arm').onclick=()=>{const a=parsed();if(!a||armed||writing)return;armed={...a,on:true};attempt++;log('送信待ち '+fmt(armed)+' ON');status('接続待ち');paint();connect()};
$('cancel').onclick=()=>{armed=null;if(timer){clearTimeout(timer);timer=null}status('待機解除');paint()};
tick();setInterval(tick,15000);paint();})();</script>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id);let active='A',value={A:'',B:''},sign=1;
function visible(s){const t=(s+'------').slice(0,6);return t.slice(0,2)+':'+t.slice(2,4)+':'+t.slice(4,6)}
function seconds(s,clock){if(s.length!==6)return null;const h=+s.slice(0,2),m=+s.slice(2,4),v=+s.slice(4,6);return m<60&&v<60&&(!clock||h<24)?h*3600+m*60+v:null}
function padded(v){return String(v).padStart(2,'0')}
 function render(){for(const key of ['A','B']){$('calc'+key+'Text').textContent=visible(value[key]);$('calc'+key).classList.toggle('active',active===key)}$('calcOp').textContent=sign===1?'＋':'−';$('calcResult').textContent='--:--:--';$('calcNote').textContent='';const a=seconds(value.A,true),b=seconds(value.B,false);
 if(value.A.length===6&&a===null||value.B.length===6&&b===null){$('calcNote').textContent='入力確認';return}if(a===null||b===null)return;
 const total=a+sign*b,day=Math.floor(total/86400),within=((total%86400)+86400)%86400;
 $('calcResult').textContent=padded(Math.floor(within/3600))+':'+padded(Math.floor(within%3600/60))+':'+padded(within%60);
 $('calcNote').textContent=day>0?'翌日'+(day>1?' ＋'+day+'日':''):day<0?'前日'+(day< -1?' '+day+'日':''):'同じ日';
 }
 $('alarmTab').onclick=()=>{document.body.classList.remove('calculator');$('alarmView').hidden=false;$('calcView').hidden=true;$('alarmTab').classList.add('selected');$('calcTab').classList.remove('selected')};
 $('calcTab').onclick=()=>{document.body.classList.add('calculator');$('alarmView').hidden=true;$('calcView').hidden=false;$('calcTab').classList.add('selected');$('alarmTab').classList.remove('selected')};
 $('calcA').onclick=()=>{active='A';render()};$('calcB').onclick=()=>{active='B';render()};$('calcOp').onclick=()=>{sign*=-1;render()};
 $('calcPad').onclick=e=>{const k=e.target.closest('[data-digit]')?.dataset.digit;if(!k)return;let s=value[active];if(k==='clear')s='';else if(k==='back')s=s.slice(0,-1);else s=(s.length===6?'':s)+k;value[active]=s;if(s.length===6&&active==='A')active='B';render()};render();
})();</script><script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(console.warn);
  });
}
</script></html>
