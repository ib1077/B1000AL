<script>(()=>{
/* -------------------------
   MON の針（キャンバス）
--------------------------*/
const canvas=document.getElementById("monClock");
const ctx=canvas.getContext("2d");

function drawClock(){
    const now=new Date();
    const w=canvas.width;
    const h=canvas.height;
    const r=w/2;

    ctx.clearRect(0,0,w,h);
    ctx.save();
    ctx.translate(r,r);

    // 外周
    ctx.beginPath();
    ctx.arc(0,0,r-5,0,Math.PI*2);
    ctx.lineWidth=5;
    ctx.strokeStyle="black";
    ctx.stroke();

    // MON ロゴ
    ctx.fillStyle="black";
    ctx.font="bold 16px Arial";
    ctx.textAlign="center";
    ctx.fillText("MON",0,-r+85);

    // 目盛
    for(let i=0;i<60;i++){
        const ang=i*Math.PI/30;
        ctx.save();
        ctx.rotate(ang);
        ctx.beginPath();

        if(i%5===0){
            ctx.lineWidth=6;
            ctx.moveTo(0,-r+18);
            ctx.lineTo(0,-r+42);
        }else{
            ctx.lineWidth=2;
            ctx.moveTo(0,-r+18);
            ctx.lineTo(0,-r+34);
        }
        ctx.stroke();
        ctx.restore();
    }

    const sec=now.getSeconds();
    const min=now.getMinutes()+sec/60;
    const hr=(now.getHours()%12)+min/60;

    // 時針
    drawHand(hr*Math.PI/6,75,12,"black");

    // 分針
    drawHand(min*Math.PI/30,105,9,"black");

    // 秒針
    drawSecondHand(sec*Math.PI/30,75);

    // 中心
    ctx.beginPath();
    ctx.arc(0,0,6,0,Math.PI*2);
    ctx.fillStyle="black";
    ctx.fill();

    ctx.restore();
}

function drawHand(angle,length,width,color){
    ctx.save();
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0,12);
    ctx.lineTo(0,-length);
    ctx.lineWidth=width;
    ctx.strokeStyle=color;
    ctx.stroke();
    ctx.restore();
}

function drawSecondHand(angle,length){
    ctx.save();
    ctx.rotate(angle);

    const pos=-length+2;

    ctx.beginPath();
    ctx.moveTo(0,12);
    ctx.lineTo(0,pos);
    ctx.lineWidth=3;
    ctx.strokeStyle="red";
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0,pos,7,0,Math.PI*2);
    ctx.fillStyle="red";
    ctx.fill();

    ctx.restore();
}

setInterval(drawClock,1000);
drawClock();

})();</script>

 document.querySelector('.alarmbox').classList.toggle('verified',sentConfirmed);
 $('armAction').textContent=armed?(armed.mode==='off'?'OFF接続待ち':'接続待ち'):writing?'転送中…':'B1000へ転送';
 $('arm').disabled=!!armed||writing||connecting||!parsed();

$('alarmTab').onclick=()=>{if(armed||connecting||writing)return;document.body.classList.remove('calculator');$('alarmView').hidden=false;$('alarmSummary').hidden=false;$('calcView').hidden=true;$('alarmTab').classList.add('selected');$('calcTab').classList.remove('selected');paint()};
function disconnected(){request=setting=null;if($('currentNote').className==='on'||$('currentNote').className==='off')$('currentNote').textContent+='・前回';if(pending){pending.reject(Error('接続が切れました'));pending=null}if(armed&&!writing){status('接続待ち');schedule()}else if(!writing)status('切断')}
function waitAnswer(){return new Promise((resolve,reject)=>{const t=setTimeout(()=>{pending=null;reject(Error('時計から返事がありません'))},5000);pending={resolve:b=>{clearTimeout(t);pending=null;resolve(b)},reject:e=>{clearTimeout(t);pending=null;reject(e)}}})}
async function read(){const answer=waitAnswer();try{await request.writeValueWithoutResponse(new Uint8Array([0x15]))}catch(e){pending?.reject(e);await answer.catch(()=>{});throw e}const b=await answer;log('読取: '+hex(b));if(b.length!==5||b[0]!==0x15||b[3]>23||b[4]>59)throw Error('アラーム1の返事を解読できません');return{h:b[3],m:b[4],on:!!(b[1]&0x40)}}

 if(!isSecureContext||!navigator.bluetooth)throw Error('Android ChromeのHTTPSページで開いてください');

 const svc=await server.getPrimaryService(uuid('0d'));request=await svc.getCharacteristic(uuid('2c'));setting=await svc.getCharacteristic(uuid('2d'));

function onNotify(e){const v=e.target.value,b=Array.from(new Uint8Array(v.buffer,v.byteOffset,v.byteLength));if(b[0]===0x15&&pending)pending.resolve(b)}
async function sendArmed(){if(!armed||writing)return;writing=true;const job=armed;armed=null;paint();try{

 const target=job.mode==='off'?{h:before.h,m:before.m,on:false}:{h:job.h,m:job.m,on:true};
 if(before.h===target.h&&before.m===target.m&&before.on===target.on){sentConfirmed=true;status(job.mode==='off'?'アラームはすでにOFFです':'時計はすでに '+fmt(before)+' ONです');return}
 const b=[0x15,target.on?0x40:0,0x40,target.h,target.m];log('設定送信: '+hex(b));status(job.mode==='off'?'アラームをOFFにしています…':fmt(target)+' を時計へ送信中…');
 await setting.writeValueWithResponse(new Uint8Array(b));await new Promise(r=>setTimeout(r,300));

 }catch(e){log('送信または確認失敗: '+e.name+' '+e.message);status('確認できません（再送なし）')}

$('pad').onclick=e=>{const k=e.target.closest('button')?.dataset.key;if(!k||armed||writing)return;const wasConfirmed=sentConfirmed;sentConfirmed=false;if(k==='clear')digits='';else if(k==='back')digits=digits.slice(0,-1);else digits=((wasConfirmed||digits.length===4)?'':digits)+k;paint();if(wasConfirmed||$('status').textContent==='入力確認')status('');if(digits.length>=3&&!parsed())status('入力確認')};
$('arm').onclick=()=>{const a=parsed();if(!a||armed||writing)return;sentConfirmed=false;armed={mode:'on',...a};log('送信待ち '+fmt(armed)+' ON');status('接続待ち・時計を約4秒長押し');paint();connect()};
$('offArm').onclick=()=>{if(armed||writing)return;sentConfirmed=false;armed={mode:'off'};log('OFF待ち');status('OFF待ち・時計を約4秒長押し');paint();connect()};

paint();})();</script><script>(()=>{'use strict';
const $=id=>document.getElementById(id);let active='A',value={A:'',B:''},sign=1;
function visible(s){const t=(s+'------').slice(0,6);return t.slice(0,2)+':'+t.slice(2,4)+':'+t.slice(4,6)}
function seconds(s,clock){if(s.length!==6)return null;const h=+s.slice(0,2),m=+s.slice(2,4),v=+s.slice(4,6);return m<60&&v<60&&(!clock||h<24)?h*3600+m*60+v:null}

 function render(){for(const key of ['A','B']){$('calc'+key+'Text').textContent=visible(value[key]);$('calc'+key).classList.toggle('active',active===key)}$('calcOp').textContent=sign===1?'＋':'−';$('calcResult').textContent='--:--:--';$('calcNote').textContent='';const a=seconds(value.A,true),b=seconds(value.B,false);
 if(value.A.length===6&&a===null||value.B.length===6&&b===null){$('calcNote').textContent='入力確認';return}if(a===null||b===null)return;
 const total=a+sign*b,day=Math.floor(total/86400),within=((total%86400)+86400)%86400;

 }

 $('calcTab').onclick=()=>{document.body.classList.add('calculator');$('alarmView').hidden=true;$('alarmSummary').hidden=true;$('calcView').hidden=false;$('calcTab').classList.add('selected');$('alarmTab').classList.remove('selected')};

})();</script><script>
const updateButton = document.getElementById('updateApp');
let registration;
async function registerApp() {
  if (!('serviceWorker' in navigator) || !isSecureContext) throw Error('更新できません');
  return registration || (registration = await navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}));
}
addEventListener('load', () => registerApp().catch(console.warn));
updateButton.onclick = async () => {
  const buttons = [...document.querySelectorAll('button')].map(button => [button,button.disabled]);
  buttons.forEach(([button]) => button.disabled = true);
  updateButton.textContent = '更新中…';
  try {
    const reg = await registerApp();
    await reg.update();
    const worker = reg.installing || reg.waiting;
    if (worker && worker.state !== 'activated') await new Promise((resolve,reject) => {
      const timeout = setTimeout(() => { cleanup(); reject(Error('更新待機終了')); },20000);
      const cleanup = () => {clearTimeout(timeout);worker.removeEventListener('statechange',check)};
      function check() {
        if (worker.state === 'activated') {cleanup();resolve()}
        else if (worker.state === 'redundant') {cleanup();reject(Error('更新失敗'))}
      }
      worker.addEventListener('statechange',check);
      worker.postMessage({type:'SKIP_WAITING'});
      check();
    });
    location.reload();
  } catch (error) {
    console.warn(error);
    updateButton.textContent = '更新できません';
    buttons.forEach(([button,disabled]) => button.disabled = disabled);
    setTimeout(() => updateButton.textContent = 'Ver.0.1.10',2500);
  }
};
